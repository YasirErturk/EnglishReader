<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ayar laboratuvarı · English Reader</title>
<link rel="stylesheet" href="style.css">
<style>
html,body{height:100%;overflow:hidden}
#labBar{
    position:fixed;left:0;right:0;top:0;z-index:20;
    background:#161616;padding:16px 20px 18px;
    display:grid;grid-template-columns:1fr 1fr 1fr 1fr auto;gap:14px;align-items:end;
}
#labBar label{display:block;font-size:13px;margin-bottom:6px;color:#bbb}
#labBar input,#labBar select{width:100%;background:#111;color:#fff;border:1px solid #333;border-radius:8px;padding:8px}
#labBar a,#labBar button{
    border:none;border-radius:12px;padding:12px 16px;cursor:pointer;text-decoration:none;color:#fff;background:#3478f6;font-size:14px;display:inline-block;
}
#reader.lab{
    height:100vh;
    overflow-y:auto;
    padding:130px 30px 40px;
}
</style>
</head>
<body>
<div id="labBar">
    <div>
        <label>Hız <span id="speedLabel">0.6</span></label>
        <input id="speedSlider" type="range" min="0.2" max="7" step="0.1" value="0.6">
    </div>
    <div>
        <label>Yazı boyutu</label>
        <input id="fontSlider" type="range" min="20" max="60" step="1" value="34">
    </div>
    <div>
        <label>Satır aralığı</label>
        <input id="lineSlider" type="range" min="1.2" max="3.5" step="0.1" value="2.2">
    </div>
    <div>
        <label>Sözlük görünümü</label>
        <select id="dictStyle">
            <option value="simple">Sadece Türkçe</option>
            <option value="detail">Tür + anlam</option>
            <option value="redhouse">Ayrıntılı</option>
        </select>
    </div>
    <div>
        <button id="saveBtn" type="button">Kaydet</button>
        <a href="index.html">Ana sayfa</a>
    </div>
</div>

<main id="reader" class="lab">
    <div id="textContainer"></div>
</main>

<script src="js/settings.js"></script>
<script>
const box = document.getElementById("textContainer");
const speedSlider = document.getElementById("speedSlider");
const fontSlider = document.getElementById("fontSlider");
const lineSlider = document.getElementById("lineSlider");
const dictStyle = document.getElementById("dictStyle");
const speedLabel = document.getElementById("speedLabel");
const readerEl = document.getElementById("reader");
const settings = new Settings();

function chunk() {
    const p = document.createElement("p");
    p.textContent = "metin metin metin metin metin metin metin metin metin metin metin metin metin metin metin metin metin metin metin metin";
    return p;
}

function fill() {
    for (let i = 0; i < 40; i++) box.appendChild(chunk());
}
fill();

function apply() {
    settings.speed = parseFloat(speedSlider.value);
    box.style.fontSize = fontSlider.value + "px";
    box.style.lineHeight = lineSlider.value;
    speedLabel.textContent = Number(speedSlider.value).toFixed(1);
}

function load() {
    const saved = localStorage.getItem("readerSettings");
    if (saved) {
        const data = JSON.parse(saved);
        if (data.speed) speedSlider.value = data.speed;
        if (data.font) fontSlider.value = data.font;
        if (data.line) lineSlider.value = data.line;
        if (data.dictStyle) dictStyle.value = data.dictStyle;
    }
    apply();
}

speedSlider.addEventListener("input", apply);
fontSlider.addEventListener("input", apply);
lineSlider.addEventListener("input", apply);

document.getElementById("saveBtn").addEventListener("click", function () {
    localStorage.setItem("readerSettings", JSON.stringify({
        speed: parseFloat(speedSlider.value),
        font: parseInt(fontSlider.value, 10),
        line: parseFloat(lineSlider.value),
        dictStyle: dictStyle.value
    }));
    this.textContent = "Kaydedildi";
});

readerEl.addEventListener("scroll", function () {
    if (readerEl.scrollTop + readerEl.clientHeight > readerEl.scrollHeight - 400) {
        fill();
    }
});

load();

(function loop() {
    readerEl.scrollTop += settings.speed;
    requestAnimationFrame(loop);
})();
</script>
</body>
</html>
