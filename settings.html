<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ayarlar · English Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<link rel="icon" href="assets/logo.png">
<style>
body[data-paper="cream"]{background:#f3ead8;color:#1c1914}
body[data-paper="paper"]{background:#fffaf2;color:#1a1916}
body[data-paper="sage"]{background:#e7efe8;color:#1a2a22}
body[data-paper="night"]{background:#161513;color:#f3eee6}
body[data-paper="night"] .nav .btn-ghost{color:#f3eee6;border-color:#4a453c}
body[data-paper="night"] .card{background:#22201c;border-color:#3a362f;color:#f3eee6}
body[data-paper="night"] .muted,body[data-paper="night"] .sub{color:#a39b8f}
.settings-grid{
    display:grid;
    grid-template-columns:minmax(280px,1fr) minmax(280px,1.1fr);
    gap:28px;
    padding:8px 0 80px;
    align-items:start;
}
.field{margin:0 0 18px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}
.field input[type="range"],.field select{
    width:100%;
    background:#fff;
    color:#1c1914;
    border:1px solid var(--line);
    border-radius:12px;
    padding:10px;
    font:inherit;
}
.check{display:flex;gap:10px;align-items:center;font-size:15px}
.swatches{display:flex;gap:10px}
.swatches button{
    width:38px;height:38px;border-radius:50%;
    border:2px solid #cbbfa8;cursor:pointer;padding:0;
}
.swatches button.on{border-color:#1c1914;box-shadow:0 0 0 2px #fff inset}
.swatches [data-paper="cream"]{background:#f3ead8 !important}
.swatches [data-paper="paper"]{background:#fffaf2 !important}
.swatches [data-paper="sage"]{background:#dce8df !important}
.swatches [data-paper="night"]{background:#1c1b19 !important}
.preview-card{
    height:min(640px, calc(100vh - 160px));
    overflow:hidden;
    position:relative;
    padding:0;
}
#previewRead{
    height:100%;
    overflow:hidden;
    padding:36px 28px 80px;
}
#previewText{
    max-width:42ch;
    margin:0 auto;
    font-family:Fraunces,Georgia,serif;
    line-height:1.8;
}
#previewText p{margin:0 0 1.2em}
.hello{margin-top:8px}
</style>
</head>
<body data-paper="cream">
<div class="wrap">
    <nav class="nav">
        <a class="brand" href="index.html">
            <img src="assets/logo.png" alt="">
            English Reader
        </a>
        <div class="nav-actions">
            <a class="btn btn-ghost" href="index.html">Ana sayfa</a>
            <a class="btn btn-blue" href="settings.html">Ayarlar</a>
            <a class="btn btn-ghost" href="dashboard.html" id="panelLink" style="display:none">Panelim</a>
            <button class="btn btn-google" id="loginButton" type="button">Google ile üye ol</button>
            <button class="btn btn-ghost" id="logoutButton" type="button" style="display:none">Çıkış</button>
        </div>
    </nav>

    <h1 class="hello">Ayarlar</h1>
    <p class="sub">Okuyucu bu değerleri hatırlar. Kaydetmeden çıkarsan son kayıt kalır.</p>

    <div class="settings-grid">
        <div class="card">
            <div class="field">
                <label>Kaydırma hızı <span id="speedLabel">0.6</span></label>
                <input id="speedSlider" type="range" min="0.2" max="7" step="0.1" value="0.6">
            </div>
            <div class="field">
                <label>Yazı boyutu</label>
                <input id="fontSlider" type="range" min="20" max="60" step="1" value="34">
            </div>
            <div class="field">
                <label>Satır aralığı</label>
                <input id="lineSlider" type="range" min="1.2" max="3.5" step="0.1" value="2.2">
            </div>
            <div class="field">
                <label>Sözlük görünümü</label>
                <select id="dictStyle">
                    <option value="simple">Sadece Türkçe</option>
                    <option value="detail">Tür + anlam</option>
                    <option value="redhouse">Ayrıntılı</option>
                </select>
            </div>
            <div class="field">
                <label>Sayfa rengi</label>
                <div id="paperSwatches" class="swatches">
                    <button type="button" data-paper="cream" title="Krem"></button>
                    <button type="button" data-paper="paper" title="Beyaz"></button>
                    <button type="button" data-paper="sage" title="Adaçayı"></button>
                    <button type="button" data-paper="night" title="Gece"></button>
                </div>
            </div>
            <div class="field">
                <label>Ses hızı</label>
                <input id="speechRate" type="range" min="0.6" max="1.4" step="0.05" value="0.95">
            </div>
            <div class="field">
                <label>Ses</label>
                <select id="voiceProfile">
                    <option value="woman">Kadın</option>
                    <option value="man">Erkek</option>
                    <option value="old">Yaşlı</option>
                    <option value="young">Genç</option>
                    <option value="child">Çocuk</option>
                </select>
            </div>
            <div class="field">
                <label class="check">
                    <input id="autoSpeak" type="checkbox">
                    Her çeviriyi sesli oku
                </label>
            </div>
            <button class="btn btn-blue" id="saveBtn" type="button">Kaydet</button>
        </div>

        <div class="card preview-card">
            <div id="previewRead">
                <div id="previewText"></div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/prefs.js"></script>
<script src="js/api.js"></script>
<script src="js/settings.js"></script>
<script>
const SAMPLE = [
    "Reading a book in English is a quiet kind of travel. Each page asks you to listen, to notice a new word, and to stay with a sentence until it opens.",
    "When you read slowly, meaning arrives like morning light. You do not force it. You let the story teach you how it wants to be heard.",
    "A good book keeps you company. It does not hurry. It offers the same line again until your ear recognizes it as music.",
    "To learn a language is to make a home in someone else's words. Keep reading. The path is made of pages, and every page is a small door."
];

const box = document.getElementById("previewText");
const scroller = document.getElementById("previewRead");
const speedSlider = document.getElementById("speedSlider");
const fontSlider = document.getElementById("fontSlider");
const lineSlider = document.getElementById("lineSlider");
const dictStyle = document.getElementById("dictStyle");
const speechRate = document.getElementById("speechRate");
const voiceProfile = document.getElementById("voiceProfile");
const autoSpeak = document.getElementById("autoSpeak");
const speedLabel = document.getElementById("speedLabel");
const saveBtn = document.getElementById("saveBtn");
const settings = new Settings();

function para(text) {
    const p = document.createElement("p");
    p.textContent = text;
    return p;
}

function fill() {
    SAMPLE.forEach(function (t) { box.appendChild(para(t)); });
}
fill();
fill();

function apply() {
    settings.speed = parseFloat(speedSlider.value);
    box.style.fontSize = fontSlider.value + "px";
    box.style.lineHeight = lineSlider.value;
    speedLabel.textContent = Number(speedSlider.value).toFixed(1);
}

function collect() {
    return {
        speed: parseFloat(speedSlider.value),
        font: parseInt(fontSlider.value, 10),
        line: parseFloat(lineSlider.value),
        dictStyle: dictStyle.value,
        speechRate: parseFloat(speechRate.value),
        voiceProfile: voiceProfile.value,
        autoSpeak: !!autoSpeak.checked,
        paper: document.body.getAttribute("data-paper") || "cream"
    };
}

function markDirty() {
    saveBtn.textContent = "Kaydet";
}

function load() {
    const data = readPrefs();
    speedSlider.value = data.speed;
    fontSlider.value = data.font;
    lineSlider.value = data.line;
    dictStyle.value = data.dictStyle;
    speechRate.value = data.speechRate;
    voiceProfile.value = data.voiceProfile || "woman";
    autoSpeak.checked = !!data.autoSpeak;
    applyPaper(data.paper || "cream");
    apply();
}

[speedSlider, fontSlider, lineSlider, speechRate].forEach(function (el) {
    el.addEventListener("input", function () {
        apply();
        markDirty();
    });
});
[dictStyle, voiceProfile, autoSpeak].forEach(function (el) {
    el.addEventListener("change", markDirty);
});

document.querySelectorAll("#paperSwatches button").forEach(function (btn) {
    btn.addEventListener("click", function () {
        applyPaper(btn.getAttribute("data-paper"));
        markDirty();
    });
});

saveBtn.addEventListener("click", function () {
    writePrefs(collect());
    this.textContent = "Kaydedildi";
});

scroller.addEventListener("scroll", function () {
    if (scroller.scrollTop + scroller.clientHeight > scroller.scrollHeight - 400) fill();
});

load();

(function loop() {
    scroller.scrollTop += settings.speed;
    requestAnimationFrame(loop);
})();

(async function nav() {
    const login = document.getElementById("loginButton");
    const logout = document.getElementById("logoutButton");
    const panel = document.getElementById("panelLink");
    if (login) login.addEventListener("click", function () { API.signInGoogle(); });
    if (logout) logout.addEventListener("click", API.signOut);
    if (!API.configured) return;
    const session = await API.getSession();
    if (!session) return;
    if (login) login.style.display = "none";
    if (logout) logout.style.display = "inline-flex";
    if (panel) panel.style.display = "inline-flex";
})();
</script>
</body>
</html>
