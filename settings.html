<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ayar laboratuvarı · English Reader</title>
<link rel="stylesheet" href="style.css">
<style>
html,body{height:100%;overflow:hidden}
#labBar{
    position:fixed;left:0;right:0;top:0;z-index:20;
    background:#efe6d6;color:#1c1914;padding:14px 20px 16px;
    display:grid;grid-template-columns:repeat(4,1fr) auto;gap:12px;align-items:end;
    border-bottom:1px solid #e4d8c4;
}
#labBar .row2{grid-column:1 / -1;display:grid;grid-template-columns:repeat(4,1fr) auto;gap:12px;align-items:end}
#labBar label{display:block;font-size:13px;margin-bottom:6px;color:#5c564c;font-family:Arial,sans-serif}
#labBar input,#labBar select{width:100%;background:#fff;color:#1c1914;border:1px solid #d7ccba;border-radius:8px;padding:8px}
#labBar a,#labBar button{
    border:none;border-radius:12px;padding:12px 16px;cursor:pointer;text-decoration:none;color:#fff;background:#2c6e57;font-size:14px;display:inline-block;
}
#labBar .check label{display:flex;gap:8px;align-items:center;margin:0 0 8px}
#labBar .check input{width:auto}
#reader.lab{
    height:100vh;
    overflow-y:auto;
    padding:210px 30px 40px;
}
</style>
</head>
<body data-paper="cream">
<div id="labBar">
    <div>
        <label>Kaydırma hızı <span id="speedLabel">0.6</span></label>
        <input id="speedSlider" type="range" min="0.2" max="7" step="0.1" value="0.6">
    </div>
    <div>
        <label>Yazı boyutu</label>
        <input id="fontSlider" type="range" min="20" max="60" step="1" value="34">
    </div>
    <div>
        <label>Satır aralığı</label>
        <input id="lineSlider" type="range" min="1.2" max="3.5" step="0.1" value="2.2">
    </div>
    <div>
        <label>Sözlük görünümü</label>
        <select id="dictStyle">
            <option value="simple">Sadece Türkçe</option>
            <option value="detail">Tür + anlam</option>
            <option value="redhouse">Ayrıntılı</option>
        </select>
    </div>
    <div>
        <button id="saveBtn" type="button">Kaydet</button>
        <a href="index.html">Ana sayfa</a>
    </div>
    <div class="row2">
        <div>
            <label>Ses hızı</label>
            <input id="speechRate" type="range" min="0.6" max="1.4" step="0.05" value="0.95">
        </div>
        <div>
            <label>Ses</label>
            <select id="voiceProfile">
                <option value="woman">Kadın</option>
                <option value="man">Erkek</option>
                <option value="old">Yaşlı</option>
                <option value="young">Genç</option>
                <option value="child">Çocuk</option>
            </select>
        </div>
        <div>
            <label>Sayfa rengi</label>
            <div id="paperSwatches" class="swatches">
                <button type="button" data-paper="cream" title="Krem"></button>
                <button type="button" data-paper="paper" title="Beyaz"></button>
                <button type="button" data-paper="sage" title="Adaçayı"></button>
                <button type="button" data-paper="night" title="Gece"></button>
            </div>
        </div>
        <div class="check">
            <label>
                <input id="autoSpeak" type="checkbox">
                Her çeviriyi sesli oku
            </label>
        </div>
    </div>
</div>

<main id="reader" class="lab">
    <div id="textContainer"></div>
</main>

<script src="js/prefs.js"></script>
<script src="js/settings.js"></script>
<script>
const box = document.getElementById("textContainer");
const speedSlider = document.getElementById("speedSlider");
const fontSlider = document.getElementById("fontSlider");
const lineSlider = document.getElementById("lineSlider");
const dictStyle = document.getElementById("dictStyle");
const speechRate = document.getElementById("speechRate");
const voiceProfile = document.getElementById("voiceProfile");
const autoSpeak = document.getElementById("autoSpeak");
const speedLabel = document.getElementById("speedLabel");
const readerEl = document.getElementById("reader");
const settings = new Settings();

function chunk() {
    const p = document.createElement("p");
    p.textContent = "metin metin metin metin metin metin metin metin metin metin metin metin metin metin metin metin metin metin metin metin";
    return p;
}

function fill() {
    for (let i = 0; i < 40; i++) box.appendChild(chunk());
}
fill();

function apply() {
    settings.speed = parseFloat(speedSlider.value);
    box.style.fontSize = fontSlider.value + "px";
    box.style.lineHeight = lineSlider.value;
    speedLabel.textContent = Number(speedSlider.value).toFixed(1);
}

function collect() {
    return {
        speed: parseFloat(speedSlider.value),
        font: parseInt(fontSlider.value, 10),
        line: parseFloat(lineSlider.value),
        dictStyle: dictStyle.value,
        speechRate: parseFloat(speechRate.value),
        voiceProfile: voiceProfile.value,
        autoSpeak: !!autoSpeak.checked,
        paper: document.body.getAttribute("data-paper") || "cream"
    };
}

function load() {
    const data = readPrefs();
    speedSlider.value = data.speed;
    fontSlider.value = data.font;
    lineSlider.value = data.line;
    dictStyle.value = data.dictStyle;
    speechRate.value = data.speechRate;
    voiceProfile.value = data.voiceProfile || "woman";
    autoSpeak.checked = !!data.autoSpeak;
    applyPaper(data.paper || "cream");
    apply();
}

speedSlider.addEventListener("input", apply);
fontSlider.addEventListener("input", apply);
lineSlider.addEventListener("input", apply);

document.querySelectorAll("#paperSwatches button").forEach(function (btn) {
    btn.addEventListener("click", function () {
        applyPaper(btn.getAttribute("data-paper"));
    });
});

document.getElementById("saveBtn").addEventListener("click", function () {
    writePrefs(collect());
    this.textContent = "Kaydedildi";
});

readerEl.addEventListener("scroll", function () {
    if (readerEl.scrollTop + readerEl.clientHeight > readerEl.scrollHeight - 400) {
        fill();
    }
});

load();

(function loop() {
    readerEl.scrollTop += settings.speed;
    requestAnimationFrame(loop);
})();
</script>
</body>
</html>
